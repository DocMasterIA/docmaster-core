apiVersion: 1

providers:
  - name: DocMaster
    orgId: 1
    folder: DocMaster
    type: file
    disableDeletion: false
    updateIntervalSeconds: 5
    # false = ficheiro no repo ganha sempre; evita dashboard antigo preso no volume
    allowUiUpdates: false
    overwrite: true
    options:
      path: /etc/grafana/provisioning/dashboards/json
