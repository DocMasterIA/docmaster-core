apiVersion: 1

deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    # Mesmo compose: nome do serviço (mais estável que host.docker.internal:9090).
    url: http://prometheus:9090
    isDefault: true
    editable: true
