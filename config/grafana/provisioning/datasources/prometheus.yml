apiVersion: 1

deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    # Padrão: Prometheus no mesmo host (porta 9090 publicada em 127.0.0.1).
    # Não usa api.docmasteria.com.br — isso exigiria nginx extra (opcional).
    url: http://host.docker.internal:9090
    isDefault: true
    editable: true
