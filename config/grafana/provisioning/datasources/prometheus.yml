apiVersion: 1

# Recria o datasource com uid fixo (evita painéis órfãos após primeiro provisionamento manual).
deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
