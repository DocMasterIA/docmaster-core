# Prometheus — DocMaster
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Produção: API pública (mesmo endpoint que você abre no browser).
  - job_name: backend
    scheme: https
    metrics_path: /metrics
    scrape_interval: 30s
    static_configs:
      - targets: ["api.docmasteria.com.br"]
        labels:
          service: backend

  # Alternativa — backend no mesmo host Docker, porta 8001 publicada.
  # Descomente SOMENTE se NÃO usar o job HTTPS acima (evita métricas duplicadas).
  # - job_name: backend
  #   metrics_path: /metrics
  #   scrape_interval: 15s
  #   static_configs:
  #     - targets: ["host.docker.internal:8001"]
  #       labels:
  #         service: backend

  # Desenvolvimento (docker compose na mesma rede): métricas diretas do llm_api.
  # Em produção os tokens por prefeitura/fluxo vêm do job backend (docmaster_llm_tokens_total).
  # - job_name: llm_api
  #   metrics_path: /metrics
  #   scrape_interval: 30s
  #   static_configs:
  #     - targets: ["llm_api:8002"]
  #       labels:
  #         service: llm_api
