# Prometheus — DocMaster
#
# Dois tipos de métrica (não misturar):
#   backend  → https://api.docmasteria.com.br/metrics  (docmaster_*, django_*)
#   node     → node_exporter na porta 9100 da MÁQUINA (CPU, RAM, disco)
#              NÃO existe em /metrics da API.
#
# Grafana (produção): https://api.docmasteria.com.br/prometheus/ — não confundir com /metrics da API.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    metrics_path: /prometheus/metrics
    static_configs:
      - targets: ["localhost:9090"]

  # App (produção) — o que você já usa com sucesso.
  - job_name: backend
    scheme: https
    metrics_path: /metrics
    scrape_interval: 30s
    static_configs:
      - targets: ["api.docmasteria.com.br"]
        labels:
          service: backend

  # Host — node_exporter no servidor (compose local: porta 9100 publicada no host).
  - job_name: node
    scrape_interval: 15s
    static_configs:
      - targets: ["node_exporter:9100"]
        labels:
          instance: docmaster-host
