# Prometheus — DocMaster
# Host: job node (node_exporter). App: job backend (/metrics Django).
# Dashboard: scripts/build-grafana-dashboard.py → layout-v41-host

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Host — node_exporter publica 127.0.0.1:9100 no host (docker-compose ports).
  # host.docker.internal evita conflito quando o contentor foi criado noutro `docker compose` (~ vs docmaster-core).
  - job_name: node
    scrape_interval: 15s
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels:
          instance: docmaster-host

  # API Django (métricas docmaster_* + django_*).
  - job_name: backend
    scheme: https
    metrics_path: /metrics
    scrape_interval: 30s
    static_configs:
      - targets: ["api.docmasteria.com.br"]
        labels:
          service: backend

  # Backend local (compose com porta 8001 publicada) — não use junto com o job HTTPS acima.
  # - job_name: backend
  #   metrics_path: /metrics
  #   scrape_interval: 15s
  #   static_configs:
  #     - targets: ["host.docker.internal:8001"]
  #       labels:
  #         service: backend
