# Stack isolada: feeds por plataforma (independentes) + researcher de preços.
# Projeto Compose separado (name) → não mistura com grafana/backend no mesmo «up».
#
#   docker compose -f docker-compose.pncp.yml up -d
#   ./scripts/ensure-pncp-researcher.sh
#
# Arquitetura:
#   price_index_feed_pncp         :8013  — só PNCP (worker 24/7)
#   price_index_feed_tce_rs       :8014  — só TCE-RS / LicitaCon → platform_index
#   price_index_feed_compras_gov  :8015  — CSV Dados Abertos Compras.gov → platform_index
#   pncp_researcher_service       :8012  — busca federada (Django proxy); só lê .db
#
# Docs: docs/pncp/ARQUITETURA-FEEDS-INDEPENDENTES.md

name: docmaster-pncp

x-pncp-image: &pncp-image
  build:
    context: ${PNCP_BUILD_CONTEXT:-.}
    dockerfile: pncp_researcher_service/Dockerfile
  image: docmaster-pncp_researcher_service

x-pncp-volumes: &pncp-volumes
  - pncp_researcher_data:/data/pncp
  - price_platform_data:/data/platforms
  - price_crosslink_data:/data/crosslink

x-pncp-db-env: &pncp-db-env
  PNCP_LOCAL_DB_PATH: /data/pncp/pncp_researcher_local.db
  PRICE_PLATFORM_DATA_ROOT: /data/platforms
  PRICE_CROSSLINK_DB_PATH: /data/crosslink/price_cross_refs.db
  TCE_RS_LOCAL_DB_PATH: /data/platforms/tce_rs_local.db
  COMPRAS_GOV_LOCAL_DB_PATH: /data/platforms/compras_gov_local.db

services:
  # ── Feed PNCP (escrita exclusiva do índice legacy) ─────────────────────
  price_index_feed_pncp:
    <<: *pncp-image
    container_name: price_index_feed_pncp
    ports:
      - "127.0.0.1:8013:8013"
    environment:
      <<: *pncp-db-env
      PORT: "8013"
      SERVICE_MODE: feed
      FEED_PLATFORM: pncp
      PNCP_BASE_URL: https://pncp.gov.br/api/consulta
      PNCP_TIMEOUT: "60"
      PNCP_FTS5_ENABLED: ${PNCP_FTS5_ENABLED:-1}
      PNCP_INGEST_QUEUE_ENABLED: ${PNCP_INGEST_QUEUE_ENABLED:-1}
      PNCP_INGEST_WORKER_ENABLED: ${PNCP_INGEST_WORKER_ENABLED:-1}
      PNCP_INGEST_AUTOPAUSE_ENABLED: ${PNCP_INGEST_AUTOPAUSE_ENABLED:-1}
      PNCP_INGEST_WATERMARK_RESUME: ${PNCP_INGEST_WATERMARK_RESUME:-1}
      PNCP_INGEST_FETCH_ITEM_RESULTADOS: ${PNCP_INGEST_FETCH_ITEM_RESULTADOS:-1}
      PNCP_INGEST_BACKFILL_MODE: ${PNCP_INGEST_BACKFILL_MODE:-1}
      PNCP_LOCAL_BACKFILL_DAYS: ${PNCP_LOCAL_BACKFILL_DAYS:-365}
      PNCP_INGEST_ITEMS_REFRESH_DAYS: ${PNCP_INGEST_ITEMS_REFRESH_DAYS:-3}
    volumes: *pncp-volumes
    networks:
      - docmaster_net
    restart: always
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8013/api/pncp-feed/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Feed TCE-RS (escrita exclusiva de tce_rs_local.db; independente do PNCP) ──
  price_index_feed_tce_rs:
    <<: *pncp-image
    container_name: price_index_feed_tce_rs
    ports:
      - "127.0.0.1:8014:8014"
    environment:
      <<: *pncp-db-env
      PORT: "8014"
      SERVICE_MODE: feed
      FEED_PLATFORM: tce_rs
      PNCP_INGEST_WORKER_ENABLED: "0"
      TCE_RS_INGEST_DATA_DIR: ${TCE_RS_INGEST_DATA_DIR:-/data/tce_rs/raw}
    volumes:
      - price_platform_data:/data/platforms
      - price_crosslink_data:/data/crosslink
      - ${TCE_RS_RAW_HOST_DIR:-./pncp_researcher_service/data/tce_rs/raw}:/data/tce_rs/raw:ro
    networks:
      - docmaster_net
    restart: always
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8014/api/pncp-feed/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Feed Compras.gov (CSV Dados Abertos → compras_gov_local.db; sem parse ainda) ──
  price_index_feed_compras_gov:
    <<: *pncp-image
    container_name: price_index_feed_compras_gov
    ports:
      - "127.0.0.1:8016:8016"
    environment:
      <<: *pncp-db-env
      PORT: "8016"
      SERVICE_MODE: feed
      FEED_PLATFORM: compras_gov
      PNCP_INGEST_WORKER_ENABLED: "0"
      COMPRAS_GOV_INGEST_DATA_DIR: ${COMPRAS_GOV_INGEST_DATA_DIR:-/data/compras_gov/raw}
    volumes:
      - price_platform_data:/data/platforms
      - price_crosslink_data:/data/crosslink
      - ${COMPRAS_GOV_RAW_HOST_DIR:-./pncp_researcher_service/data/compras_gov/raw}:/data/compras_gov/raw:ro
    networks:
      - docmaster_net
    restart: always
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8016/api/pncp-feed/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Researcher (só leitura + Camada B; alimentado pelos feeds via volumes) ──
  pncp_researcher_service:
    <<: *pncp-image
    container_name: pncp_researcher_service
    ports:
      - "127.0.0.1:8012:8012"
    environment:
      <<: *pncp-db-env
      PORT: "8012"
      SERVICE_MODE: researcher
      PNCP_BASE_URL: https://pncp.gov.br/api/consulta
      PNCP_TIMEOUT: "60"
      PNCP_DEFAULT_LOOKBACK_DAYS: "180"
      PNCP_MAX_PAGINAS_PER_REQUEST: ${PNCP_MAX_PAGINAS_PER_REQUEST:-120}
      PNCP_FTS5_ENABLED: ${PNCP_FTS5_ENABLED:-1}
      PNCP_INGEST_WORKER_ENABLED: "0"
      PNCP_LOCAL_AUTO_INGEST: "0"
      PNCP_HYBRID_FALLBACK_ENABLED: ${PNCP_HYBRID_FALLBACK_ENABLED:-1}
      PNCP_HYBRID_BULK_ENABLED: ${PNCP_HYBRID_BULK_ENABLED:-1}
      PNCP_HYBRID_MIN_LOCAL_RESULTS: ${PNCP_HYBRID_MIN_LOCAL_RESULTS:-8}
      PNCP_HYBRID_MAX_LIVE_PAGES: ${PNCP_HYBRID_MAX_LIVE_PAGES:-6}
      PNCP_BULK_MAX_TERM_FALLBACKS: ${PNCP_BULK_MAX_TERM_FALLBACKS:-6}
      PNCP_BULK_SEARCH_MAX_SECONDS: ${PNCP_BULK_SEARCH_MAX_SECONDS:-90}
      PNCP_BULK_ENRICH_HOMOLOG_MAX: ${PNCP_BULK_ENRICH_HOMOLOG_MAX:-2}
      PNCP_BULK_LOCAL_ENRICH_HOMOLOG_MAX: ${PNCP_BULK_LOCAL_ENRICH_HOMOLOG_MAX:-0}
      PNCP_BULK_USE_INTELLIGENT_PIPELINE: ${PNCP_BULK_USE_INTELLIGENT_PIPELINE:-0}
      PNCP_BULK_INTELLIGENT_SQL_LIMIT: ${PNCP_BULK_INTELLIGENT_SQL_LIMIT:-2000}
      PNCP_BULK_INTELLIGENT_MAX_TERM_FALLBACKS: ${PNCP_BULK_INTELLIGENT_MAX_TERM_FALLBACKS:-6}
      PNCP_SEARCH_ONLY_HOMOLOGATED: ${PNCP_SEARCH_ONLY_HOMOLOGATED:-1}
      PNCP_SEARCH_ENRICH_HOMOLOG_MAX: ${PNCP_SEARCH_ENRICH_HOMOLOG_MAX:-16}
      PNCP_SEARCH_MIN_SCORE_APROVACAO: ${PNCP_SEARCH_MIN_SCORE_APROVACAO:-50}
      PNCP_IA_BASE_URL: ${PNCP_IA_BASE_URL:-http://qwen_llm_service:8015}
      PNCP_IA_MODEL: ${PNCP_IA_MODEL:-}
      PNCP_IA_TIMEOUT_SECONDS: ${PNCP_IA_TIMEOUT_SECONDS:-22}
      PNCP_IA_ITEM_RESUMO_TIMEOUT_SECONDS: ${PNCP_IA_ITEM_RESUMO_TIMEOUT_SECONDS:-18}
      PNCP_IA_RERANK_ENABLED: ${PNCP_IA_RERANK_ENABLED:-1}
      PNCP_IA_ITEM_RESUMO_ENABLED: ${PNCP_IA_ITEM_RESUMO_ENABLED:-1}
      PNCP_LOCAL_RERANK_ENABLED: ${PNCP_LOCAL_RERANK_ENABLED:-1}
      PNCP_LOCAL_RERANK_MAX_CANDIDATES: ${PNCP_LOCAL_RERANK_MAX_CANDIDATES:-24}
      PNCP_LOCAL_RERANK_ONLY_AMBIGUOUS: ${PNCP_LOCAL_RERANK_ONLY_AMBIGUOUS:-1}
      PNCP_IA_RERANK_PREFER_LOCAL: ${PNCP_IA_RERANK_PREFER_LOCAL:-1}
      PNCP_IA_RERANK_BULK_ENABLED: ${PNCP_IA_RERANK_BULK_ENABLED:-0}
      PNCP_IA_BULK_MAX_CANDIDATES: ${PNCP_IA_BULK_MAX_CANDIDATES:-12}
      PNCP_IA_BULK_TIMEOUT_SECONDS: ${PNCP_IA_BULK_TIMEOUT_SECONDS:-12}
      PNCP_IA_RERANK_BULK_ONLY_AMBIGUOUS: ${PNCP_IA_RERANK_BULK_ONLY_AMBIGUOUS:-1}
      PNCP_IA_MAX_CANDIDATES: ${PNCP_IA_MAX_CANDIDATES:-36}
      PNCP_SEARCH_QUALITY_FIRST: ${PNCP_SEARCH_QUALITY_FIRST:-1}
      PNCP_SEARCH_TIER_FLEX_RATIO: ${PNCP_SEARCH_TIER_FLEX_RATIO:-0.78}
      PNCP_SEARCH_ANCHOR_TIER_ENABLED: ${PNCP_SEARCH_ANCHOR_TIER_ENABLED:-0}
      PNCP_SEARCH_MAX_SIMILAR_IN_TOP3: ${PNCP_SEARCH_MAX_SIMILAR_IN_TOP3:-1}
      PNCP_IA_RERANK_MIXED_POOL: ${PNCP_IA_RERANK_MIXED_POOL:-1}
      PNCP_FEDERATED_SEARCH_ENABLED: ${PNCP_FEDERATED_SEARCH_ENABLED:-1}
      PNCP_FEDERATED_SOURCE_TIMEOUT_SECONDS: ${PNCP_FEDERATED_SOURCE_TIMEOUT_SECONDS:-20}
      PNCP_FEDERATED_PNCP_TIMEOUT_SECONDS: ${PNCP_FEDERATED_PNCP_TIMEOUT_SECONDS:-100}
    volumes: *pncp-volumes
    networks:
      - docmaster_net
    restart: always
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8012/api/pncp-research/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  pncp_researcher_data:
  price_platform_data:
  price_crosslink_data:

networks:
  docmaster_net:
    name: docmaster_net
    external: true
