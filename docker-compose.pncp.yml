# PNCP Researcher — stack isolada (24/7, alimentação do índice local).
# Projeto Compose separado (name) → não mistura com grafana/backend no mesmo «up».
#
# DEPLOY = docmaster-core:  PNCP_BUILD_CONTEXT=. (default)
# DEPLOY = ~ com repo em docmaster-core/:  PNCP_BUILD_CONTEXT=docmaster-core
#
#   docker compose -f docker-compose.pncp.yml up -d
#   ./scripts/ensure-pncp-researcher.sh

name: docmaster-pncp

services:
  pncp_researcher_service:
    build:
      context: ${PNCP_BUILD_CONTEXT:-.}
      dockerfile: pncp_researcher_service/Dockerfile
    image: docmaster-pncp_researcher_service
    container_name: pncp_researcher_service
    ports:
      - "127.0.0.1:8012:8012"
    environment:
      - PORT=8012
      - PNCP_BASE_URL=https://pncp.gov.br/api/consulta
      - PNCP_TIMEOUT=60
      - PNCP_DEFAULT_LOOKBACK_DAYS=180
      - PNCP_MAX_PAGINAS_PER_REQUEST=${PNCP_MAX_PAGINAS_PER_REQUEST:-120}
      - PNCP_INGEST_AUTOPAUSE_ENABLED=${PNCP_INGEST_AUTOPAUSE_ENABLED:-1}
      - PNCP_INGEST_AUTOPAUSE_BASE_SECONDS=${PNCP_INGEST_AUTOPAUSE_BASE_SECONDS:-180}
      - PNCP_INGEST_AUTOPAUSE_MAX_SECONDS=${PNCP_INGEST_AUTOPAUSE_MAX_SECONDS:-1800}
      - PNCP_INGEST_AUTOPAUSE_JSON_INVALID_SECONDS=${PNCP_INGEST_AUTOPAUSE_JSON_INVALID_SECONDS:-120}
      - PNCP_FTS5_ENABLED=${PNCP_FTS5_ENABLED:-1}
      - PNCP_HYBRID_FALLBACK_ENABLED=${PNCP_HYBRID_FALLBACK_ENABLED:-1}
      - PNCP_HYBRID_MIN_LOCAL_RESULTS=${PNCP_HYBRID_MIN_LOCAL_RESULTS:-8}
      - PNCP_HYBRID_MAX_LIVE_PAGES=${PNCP_HYBRID_MAX_LIVE_PAGES:-4}
      - PNCP_LOCAL_DB_PATH=/data/pncp/pncp_researcher_local.db
    volumes:
      - pncp_researcher_data:/data/pncp
    networks:
      - docmaster_net
    # 24/7: reinicia após reboot do Docker ou crash do processo (não depende do compose principal).
    restart: always
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8012/api/pncp-research/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  # Volume nomeado do projeto docmaster-pncp. Para reutilizar índice antigo após down/up:
  #   PNCP_DATA_VOLUME=nome_do_volume_grande ./scripts/attach-pncp-volume.sh
  # (gera docker-compose.pncp.override.yml com volume external).
  pncp_researcher_data:

networks:
  docmaster_net:
    name: docmaster_net
    external: true
