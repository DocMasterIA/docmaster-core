# DocMaster IA – orquestração LLM (FastAPI)
# Uso: docker compose up -d llm_api
# Quando o Django rodar em outro serviço, defina LLM_API_BASE_URL=http://llm_api:8002
# Para carregar variáveis do .env do host: env_file: - llm_api/.env
#
# Layout: este arquivo costuma ficar ao lado da pasta do repo (ex.: ~ com ~/docmaster-core/).
# Se o compose estiver DENTRO da raiz do git (só docmaster-core/), troque "docmaster-core" por "."
# em todos os build.context e ajuste volumes ./llm_audit → caminhos relativos ao repo...
#
# Qwen só para ETP: docker compose --profile qwen up -d qwen_llm_service
# No rag_service: LLM_ETP_GENERATION_BASE_URL=http://qwen_llm_service:8015 (Ollama/llm_api segue em LLM_ORCHESTRATION_BASE_URL).
# Objeto/justificativa dispensa+inexig: LLM_CLAUSULAS_GENERATION_BASE_URL (rag) e LLM_CLAUSULAS_API_BASE_URL (backend proxy).
#
# Métricas: GET /metrics — django-prometheus + docmaster_* (logins, gerações TR/DFD, pacotes)
# Grafana:    http://127.0.0.1:3000  (na VPS; do PC use túnel SSH — ver docs/deploy/OBSERVABILIDADE-VPS.md)
# Prometheus: http://127.0.0.1:9090  (só na máquina do compose)
# URL pública em api.docmasteria.com.br/grafana é OPCIONAL (exige nginx manual — não é o padrão).
#             Dashboard provisionado: pasta DocMaster → «DocMaster — Backend Django»
#             Dashboard: python3 scripts/build-grafana-dashboard.py (no repo)
#             VPS: copie config/ + compose para DEPLOY; ver docs/deploy/OBSERVABILIDADE-VPS.md
# Config: ./config/prometheus.yml e ./config/grafana/provisioning/ (paths relativos a DEPLOY)
#
# PNCP 24/7: docker compose -f docker-compose.pncp.yml up -d  (ver docs/deploy/PNCP-RESEARCHER-24-7.md)
# Busca inteligente PNCP (IA): PNCP_IA_BASE_URL=http://qwen_llm_service:8015 no docker-compose.pncp.yml
# (qwen_llm_service precisa estar Up com profile qwen e ligado à docmaster_net — ver docker-compose.yml)
# Não subir pncp_researcher_service neste ficheiro — evita recreate ao fazer up -d backend/grafana/etc.

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_FLASH_ATTENTION=true
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=24h
    restart: unless-stopped
    # GPU: descomente se tiver NVIDIA
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
              

  llm_api:
    build:
      context: docmaster-core
      dockerfile: llm_api/Dockerfile
    image: docmaster-llm_api
    container_name: llm_api
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
      - LLM_TIMEOUT=300
      - LLM_MAX_RETRIES=1
      # LLM_AUDIT_LOG_DIR opcional; se vazio, o app usa /app/logs automaticamente
    depends_on:
      - ollama
    volumes:
      # Logs de auditoria automáticos (llm_audit_YYYY-MM-DD.jsonl) em ./llm_audit no projeto
      - ./llm_audit:/app/logs
    restart: unless-stopped

  # Gateway Qwen (OpenAI-compatible). Mesmo contrato POST /api/llm/generate que o llm_api.
  # Ative: docker compose --profile qwen up -d qwen_llm_service
  # .env na pasta do compose (obrigatório QWEN_API_KEY + QWEN_API_BASE_URL):
  #   Singapura (workspace MaaS): https://ws-XXXX.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
  qwen_llm_service:
    profiles:
      - qwen
    build:
      context: docmaster-core
      dockerfile: qwen_llm_service/Dockerfile
    image: docmaster-qwen_llm_service
    container_name: qwen_llm_service
    ports:
      - "8015:8015"
    env_file:
      - .env
    environment:
      - PORT=8015
      - QWEN_API_KEY=${QWEN_API_KEY:-}
      - QWEN_API_BASE_URL=${QWEN_API_BASE_URL:-}
      - QWEN_MODEL=${QWEN_MODEL:-qwen3.6-plus}
      - QWEN_TIMEOUT=${QWEN_TIMEOUT:-120}
      - QWEN_DAILY_TOKEN_BUDGET=${QWEN_DAILY_TOKEN_BUDGET:-0}
      - QWEN_MAX_OUTPUT_TOKENS=${QWEN_MAX_OUTPUT_TOKENS:-4096}
      - QWEN_MAX_PROMPT_CHARS=${QWEN_MAX_PROMPT_CHARS:-120000}
      - QWEN_AUDIT_LOG_DIR=/app/logs
    volumes:
      - ./qwen_llm_audit:/app/logs
    networks:
      - default
      - docmaster_net
    restart: unless-stopped

  llm_agent:
    build:
      context: docmaster-core
      dockerfile: llm_agent/Dockerfile
    image: docmaster-llm_agent
    container_name: llm_agent
    ports:
      - "8003:8003"
    environment:
      - PORT=8003
      - LLM_ORCHESTRATION_BASE_URL=http://llm_api:8002
      - AGENT_TIMEOUT=120
      - AGENT_MAX_RETRIES=2
    depends_on:
      - llm_api
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    ports:
      - "8000:8000"  # host:container (ChromaDB na 8000 na VPS)
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped

  languagetool:
    image: silviof/docker-languagetool:latest
    container_name: languagetool
    restart: unless-stopped

  text_corrector_service:
    build:
      context: docmaster-core
      dockerfile: text_corrector_service/Dockerfile
    image: docmaster-text_corrector_service
    container_name: text_corrector_service
    ports:
      - "8011:8011"
    environment:
      - PORT=8011
      - LANGUAGETOOL_BASE_URL=http://languagetool:8010
      - LANGUAGETOOL_CHECK_PATH=/v2/check
      - CORRECTOR_HTTP_TIMEOUT=30
    depends_on:
      - languagetool
    restart: unless-stopped

  rag_service:
    build:
      context: docmaster-core
      dockerfile: rag_service/Dockerfile
    image: docmaster-rag_service
    container_name: rag_service
    ports:
      - "8004:8004"
    environment:
      - PORT=8004
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000  # porta interna do container ChromaDB
      - CHROMA_COLLECTION=docmaster_docs
      - OLLAMA_BASE_URL=http://ollama:11434
      - LLM_ORCHESTRATION_BASE_URL=http://llm_api:8002
      # Geração de texto de ETP via gateway Qwen (mesmo contrato /api/llm/generate):
      - LLM_ETP_GENERATION_BASE_URL=http://qwen_llm_service:8015
      # Objeto + justificativa (dispensa / inexigibilidade — fill-tr-slots lite):
      - LLM_CLAUSULAS_GENERATION_BASE_URL=${LLM_CLAUSULAS_GENERATION_BASE_URL:-http://qwen_llm_service:8015}
      - LLM_AGENT_BASE_URL=http://llm_agent:8003
      - TEXT_CORRECTOR_ENABLED=1
      - TEXT_CORRECTOR_BASE_URL=http://text_corrector_service:8011
      - RAG_TOP_K=5
      - RAG_TIMEOUT=300
      - TR_SLOTS_INCLUDE_RAG_EXAMPLES=0
      - TR_SLOTS_ENABLE_OBJETO_REWRITE=0
      - TR_SLOTS_ENABLE_INCISO_LLM=0
    volumes:
      # Monta pasta de treinamento para acesso aos documentos
      - ./treinamento:/data/treinamento:ro
    depends_on:
      - llm_api
      - llm_agent
      - chromadb
      - text_corrector_service
    restart: unless-stopped

  backend:
    build:
      context: docmaster-core
      dockerfile: Dockerfile  # Dockerfile do backend Django na raiz do projeto
    image: docmaster-backend
    container_name: backend
    environment:
      - LLM_API_BASE_URL=http://llm_api:8002
      - LLM_CLAUSULAS_API_BASE_URL=${LLM_CLAUSULAS_API_BASE_URL:-http://qwen_llm_service:8015}
      - LLM_CLAUSULAS_PROXY_TIMEOUT=${LLM_CLAUSULAS_PROXY_TIMEOUT:-180}
      - RAG_SERVICE_URL=http://rag_service:8004
      - PNCP_RESEARCHER_BASE_URL=http://pncp_researcher_service:8012
      # Django → rag_service (TR/DFD): alinhar com proxy_read_timeout no nginx (ex. 900s).
      - RAG_HTTP_TIMEOUT=${RAG_HTTP_TIMEOUT:-300}
      - RAG_HTTP_TIMEOUT_TR_DFD_MAX=${RAG_HTTP_TIMEOUT_TR_DFD_MAX:-900}
      # PDF: Gunicorn padrão mata o worker após 30s; 0 = sem limite (ver Dockerfile).
      - GUNICORN_TIMEOUT=${GUNICORN_TIMEOUT:-0}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-4}
      - GUNICORN_THREADS=${GUNICORN_THREADS:-4}
      - GUNICORN_WORKER_CLASS=${GUNICORN_WORKER_CLASS:-gevent}
      - GUNICORN_WORKER_CONNECTIONS=${GUNICORN_WORKER_CONNECTIONS:-100}
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus_multiproc
    depends_on:
      - llm_api
      - rag_service
    networks:
      - default
      - docmaster_net
    ports:
      - "8001:8000"  # Django na 8001 no host (8000 já é ChromaDB)
    volumes:
      # Volume nomeado: o SQLite persiste entre build/up/down (não some ao reconstruir)
      # Para apagar o banco: docker compose down -v (remove volumes)
      - backend_data:/app/backend/data
      # MEDIA do Django (uploads/templates/docx) precisa persistir entre rebuilds
      - backend_media:/app/backend/media
    restart: unless-stopped

  # SPA Vue (estático) — mesmo hostname que o ingress do Cloudflare Tunnel (frontend-vue:80).
  # Mesmo prefixo que os outros builds: docmaster-core/... quando o compose roda de ~/ (pai do repo).
  frontend-vue:
    build:
      context: docmaster-core/frontend-vue
      dockerfile: Dockerfile
    image: docmaster-frontend-vue
    container_name: frontend-vue
    restart: unless-stopped

  # Exposição pública via Cloudflare Tunnel (substitui ngrok).
  # Configure CLOUDFLARE_TUNNEL_TOKEN no ambiente do host antes do up.
  # Logs: docker compose logs --tail 80 cloudflared-tunnel
  cloudflared-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-tunnel
    command: ["tunnel", "--no-autoupdate", "--protocol", "http2", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN}"]
    depends_on:
      - backend
      - frontend-vue
    restart: always

  # Métricas do host (CPU, RAM, disco, load) — scrape em prometheus job "node".
  node_exporter:
    image: prom/node-exporter:v1.9.0
    container_name: node_exporter
    restart: always
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "127.0.0.1:9100:9100"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    depends_on:
      - node_exporter
    # Scrape via host.docker.internal:8001 (config/prometheus.yml) quando backend publica 8001.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Volume nomeado evita «permission denied» em ./data no host (Prometheus roda como nobody).
      # Para bind mount no host: mkdir -p data/prometheus && chown -R 65534:65534 data/prometheus
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-lifecycle"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--storage.tsdb.wal-compression"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://127.0.0.1:3000/}
      - GF_SERVER_SERVE_FROM_SUB_PATH=${GRAFANA_SERVE_FROM_SUB_PATH:-false}
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  chroma_data:
  ollama_data:
  backend_data:   # SQLite do Django (persiste entre build/up)
  backend_media:  # MEDIA_ROOT do Django (templates/docx, previews, etc.)
  prometheus_data:     # TSDB do Prometheus
  grafana_data:        # dashboards, utilizadores, plugins

networks:
  docmaster_net:
    external: true
    name: docmaster_net
