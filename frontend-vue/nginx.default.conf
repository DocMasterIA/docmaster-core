server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Chunks JS/CSS do Vite: nunca cair no fallback SPA — senão um 404 vira index.html
    # e o browser acusa "Failed to fetch dynamically imported module".
    # Sem "always": 404 NÃO leva Cache-Control immutable (senão CF congela o 404 por 1 ano
    # e o login parte em PoPs que viram o ficheiro em falta durante um deploy).
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Evita index.html antigo apontando para hashes de build que já não existem no servidor.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        default_type text/plain;
        return 200 'ok';
    }
}
